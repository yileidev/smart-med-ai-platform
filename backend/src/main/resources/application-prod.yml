# 🛡️ 医疗急诊分诊系统 - 生产环境配置
# 此文件包含生产环境的安全和性能优化配置

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  # 🛡️ 生产环境安全配置
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    max-connections: 8192
    accept-count: 100
    connection-timeout: 20000
  # 🛡️ 启用压缩
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: medical-web-backend
  
  # 🛡️ 生产数据库配置
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&requireSSL=true&verifyServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      leak-detection-threshold: 60000
      max-lifetime: 1800000
      # 🛡️ 连接池安全配置
      validation-timeout: 5000
      connection-test-query: SELECT 1
    
  jpa:
    hibernate:
      ddl-auto: validate  # 🛡️ 生产环境只验证不更新
    show-sql: false        # 🛡️ 生产环境关闭SQL日志
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
        
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL  # 🛡️ 不序列化null值
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

# 🛡️ 生产JWT配置
jwt:
  secret: ${JWT_SECRET}  # 🔴 必须通过环境变量设置
  expiration: ${JWT_EXPIRATION:28800000}  # 8小时
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7天
  issuer: ${JWT_ISSUER:medical-web-prod}
  audience: ${JWT_AUDIENCE:medical-web-users}

# 🛡️ 生产MQTT配置
mqtt:
  broker:
    url: tcp://${MQTT_HOST}:${MQTT_PORT}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    timeout: 30
    keepalive: 60
    reconnect-delay: 5000
  client:
    id: ${MQTT_CLIENT_ID:medical-cloud-server-prod}
  topic:
    triage: "medical/triage/data"
    device:
      status: "medical/device/status"
      heartbeat: "medical/device/heartbeat"
    final: "medical/triage/final"

# 🛡️ 生产AI配置
medical:
  ai:
    provider: "baichuan"
    model:
      base-url: ${BAICHUAN_BASE_URL:https://api.baichuan-ai.com/v1}
      api-key: ${BAICHUAN_API_KEY}  # 🔴 必须设置
      name: ${BAICHUAN_MODEL_NAME:Baichuan2-Turbo-192k}
      temperature: ${BAICHUAN_TEMPERATURE:0.2}
      max-tokens: ${BAICHUAN_MAX_TOKENS:2048}
      # 🛡️ AI服务重试配置
      timeout: 30000
      retry-attempts: 3
      retry-delay: 1000
  
  vector:
    chroma:
      url: ${CHROMA_URL:http://chroma-server:8000}
      collection: ${CHROMA_COLLECTION:medical-knowledge-prod}
      timeout: 10000
    embedding:
      model: ${EMBEDDING_MODEL:all-minilm-l6-v2}
      dimension: ${EMBEDDING_DIMENSION:384}
      batch-size: 32
    
    medical:
      enable-drug-interaction-check: ${ENABLE_DRUG_CHECK:true}
      enable-prognosis-assessment: ${ENABLE_PROGNOSIS:true}
      confidence-threshold: ${CONFIDENCE_THRESHOLD:0.8}
      max-differential-diagnosis: ${MAX_DIFF_DIAGNOSIS:5}
      
# 🛡️ Drools规则引擎 - 生产环境
drools:
  rules:
    path: "classpath:rules/"
    reload: false  # 🛡️ 生产环境关闭热重载

# 🛡️ 生产日志配置
logging:
  level:
    root: INFO
    com.medical: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web: INFO
    org.springframework.boot.actuator: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/medical-web-prod.log}
    max-size: 100MB
    max-history: 30
    total-size-cap: 1GB
  logback:
    rollingpolicy:
      max-file-size: 100MB
      total-size-cap: 1GB

# 🛡️ 监控和健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    info:
      show-details: when-authorized
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false  # 🛡️ 不暴露环境变量
    build:
      enabled: true

# 🛡️ 安全跨域配置
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}  # 🔴 生产环境必须设置
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "Authorization,Content-Type,X-Requested-With"
  allow-credentials: true
  max-age: 3600

# 🛡️ 应用配置
app:
  name: Medical Emergency Triage System
  version: 2.0.0
  environment: production
  security:
    # 🛡️ 密码策略
    password-policy:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special: true
    # 🛡️ 登录安全
    login-security:
      max-attempts: 5
      lockout-duration: 900  # 15分钟
      session-timeout: 1800  # 30分钟
    # 🛡️ 审计日志
    audit:
      enabled: true
      retention-days: 90

# 🛡️ 性能优化配置
spring.task:
  execution:
    pool:
      core-size: 10
      max-size: 50
      queue-capacity: 100
      keep-alive: 60s

# 🛡️ 缓存配置
spring.cache:
  type: redis
  redis:
    time-to-live: 600000  # 10分钟
    cache-null-values: false

# 🛡️ Redis生产配置
spring.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: 0
  timeout: 5000
  lettuce:
    pool:
      max-active: 50
      max-idle: 20
      min-idle: 5
      max-wait: 5000